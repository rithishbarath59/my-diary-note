<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Diary</title>
<style>
:root{color-scheme:light;--bg:#fffaf3;--card:#fff;--ink:#4a4057;--mut:#948aa3;--ac:#ff9eb5;--ac2:#b9a7ff;--ln:#f1e6dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,'Times New Roman',serif}
.wrap{max-width:640px;margin:auto;padding:14px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5}
.row{display:flex;gap:10px;align-items:center}
h1{margin:0;font-size:24px;flex:1}
.plus{width:46px;height:46px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-size:30px;line-height:1;cursor:pointer;box-shadow:0 3px 10px #b9a7ff66}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--ln);border-radius:12px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac2);border-color:transparent}
#q{margin-top:8px}
.tags{display:flex;gap:6px;overflow-x:auto;padding:8px 0}
.chip{white-space:nowrap;border:1.5px solid var(--ln);background:#fff;border-radius:99px;padding:3px 12px;font-size:14px;cursor:pointer;color:var(--ink)}
.chip.on{background:#e9e2ff;border-color:var(--ac2)}
.entry{background:var(--card);border-radius:16px;padding:14px 16px;margin:12px 0;border-left:6px solid var(--ac);box-shadow:0 2px 8px #0000000d}
.entry:nth-child(even){border-left-color:var(--ac2)}
.d{font-weight:bold;color:#e06a8a;font-size:15px}
.n{font-size:20px;margin:2px 0}.n small{color:var(--mut);font-size:15px}
.dr{margin:2px 0;color:#6b6178}.sm{font-size:13px;color:var(--mut);margin:1px 0 4px}.pd{margin:8px 0;padding-left:10px;border-left:3px solid #e9e2ff}.pn{font-weight:bold;font-size:15px}.w{margin:6px 0;white-space:pre-wrap}
.t{display:inline-block;background:#fff0f4;color:#d4577a;border-radius:99px;padding:1px 10px;font-size:13px;margin:2px 4px 0 0}
.act{text-align:right;margin-top:4px}.act button{border:0;background:none;color:var(--mut);cursor:pointer;font:inherit;font-size:14px;margin-left:10px}
.empty{text-align:center;color:var(--mut);margin:50px 0}
#m{position:fixed;inset:0;background:#4a405766;display:none;align-items:flex-end;justify-content:center;z-index:9}
#m.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}label b{color:#e06a8a}
h3{margin:16px 0 0;color:var(--ac2);font-size:17px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.save{width:100%;margin-top:18px;padding:13px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font:bold 17px Georgia;cursor:pointer}
.x{float:right;border:0;background:none;font-size:26px;color:var(--mut);cursor:pointer}
.err{color:#d4577a;font-size:14px;margin-top:8px;min-height:18px}
#pm{position:fixed;inset:0;background:#4a405766;display:none;align-items:flex-end;justify-content:center;z-index:10}#pm.show{display:flex}.pe{font-size:20px;background:linear-gradient(135deg,#9fe0c8,#b9a7ff)}.chip small{color:var(--mut)}.pk{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.mut{color:var(--mut);font-size:14px}.add{border:1.5px dashed var(--ac2);border-radius:14px;padding:10px;margin-top:8px}.add button,.pr button{border:0;border-radius:10px;padding:8px 12px;background:#e9e2ff;color:var(--ink);font:inherit;cursor:pointer}.pr{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:8px 12px;margin:6px 0}.pr span{flex:1}.ch{margin:14px 0 2px;color:#e06a8a;font-weight:bold}
</style></head><body>
<div class="wrap">
<header>
 <div class="row"><h1>📔 My Diary</h1><button class="plus pe" onclick="openPeople()" aria-label="People">👥</button><button class="plus" onclick="openForm()" aria-label="New note">+</button></div>
 <input id="q" type="search" placeholder="Search date, title, name, nickname or tag" oninput="render()">
 <div class="tags" id="tagbar"></div><div id="pfbar"></div>
</header>
<div id="list"></div>
</div>

<div id="pm"><div class="sheet"><button class="x" onclick="$('pm').classList.remove('show')">×</button><h2 style="margin:0">👥 People</h2>
<div class="add"><div class="g"><input id="pn" placeholder="Name (e.g. Naveen)"><input id="pcat" list="cl" placeholder="Category (Friends)"></div><datalist id="cl"></datalist><button style="margin-top:8px;width:100%" onclick="addFromPeople()">+ Create person</button></div>
<div id="plist"></div></div></div>
<div id="m"><div class="sheet">
 <button class="x" onclick="closeForm()">×</button><h2 style="margin:0" id="ft">New Diary Note</h2>
 <label>Date <b>*</b></label><input type="date" id="date">
 <label>Title (e.g. Carrom)</label><input id="title" placeholder="If empty, the name is used as title"><label>Name (main person)</label><input id="name" onchange="renderDress()" list="names" placeholder="Type or pick a used name"><datalist id="names"></datalist>
 <label>Nickname</label><input id="nick">
 <label>Tag <b>*</b> (saved in tag folder)</label><input id="tag" list="tagl" placeholder="e.g. College, Family (comma for many)"><datalist id="tagl"></datalist>

 <h3>👥 People involved (select many)</h3>
 <input id="ps" type="search" placeholder="Search people…" oninput="renderPick()" style="margin-top:8px">
 <div class="pk" id="pl"></div><div class="mut" id="pcount"></div>
 <div class="add"><div class="g"><input id="qn" placeholder="New person name"><input id="qc" list="cl" placeholder="Category (Friends)"></div><button type="button" style="margin-top:8px;width:100%" onclick="quickAdd()">+ Add &amp; select</button></div>
 <h3>👕 Dress details (for each person)</h3><div id="dr"></div><datalist id="ptl"><option>jeans<option>cotton<option>lycra<option>formal<option>track</datalist>
 <label>What happened <b>*</b></label><textarea id="what" rows="6" placeholder="Write the full story of the day…"></textarea>
 <div class="err" id="err"></div>
 <button class="save" onclick="save()">Save Note</button>
</div></div>

<script>
let E=[],editId=null,ft='',P=[],sel=new Set(),pf='';
try{P=JSON.parse(localStorage.getItem('diaryP26')||'[]')}catch(e){}
function saveP(){try{localStorage.setItem('diaryP26',JSON.stringify(P))}catch(e){}}
function cats(){return[...new Set(['Friends','Family','Work','Others',...P.map(p=>p.cat)])]}
function addP(n,c){n=n.trim();c=c.trim()||'Friends';if(!n)return null;let p=P.find(x=>x.name.toLowerCase()===n.toLowerCase()&&x.cat===c);if(!p){p={id:'p'+Date.now()+P.length,name:n,cat:c};P.push(p);saveP()}return p}
function pnames(e){return(e.ppl||[]).map(i=>(P.find(p=>p.id===i)||{}).name).filter(Boolean)}
function setPf(id){pf=id;$('pm').classList.remove('show');render()}
function renderPick(){const s=$('ps').value.toLowerCase();const l=P.filter(p=>p.name.toLowerCase().includes(s)).sort((a,b)=>a.cat.localeCompare(b.cat)||a.name.localeCompare(b.name));
 $('pl').innerHTML=l.length?l.map(p=>`<button type="button" class="chip ${sel.has(p.id)?'on':''}" data-id="${p.id}">${esc(p.name)} <small>· ${esc(p.cat)}</small></button>`).join(''):'<span class="mut">No people yet — add one below</span>';
 $('pl').querySelectorAll('button').forEach(b=>b.onclick=()=>{const i=b.dataset.id;sel.has(i)?sel.delete(i):sel.add(i);renderPick()});
 $('pcount').textContent=sel.size+' selected';renderDress();$('cl').innerHTML=cats().map(c=>`<option value="${esc(c)}">`).join('')}
function quickAdd(){const p=addP($('qn').value,$('qc').value);if(p){sel.add(p.id);$('qn').value='';$('ps').value='';renderPick()}}
function openPeople(){$('pm').classList.add('show');renderPeople()}
function addFromPeople(){if(addP($('pn').value,$('pcat').value)){$('pn').value='';renderPeople()}}
function delP(id){if(confirm('Delete this person? Notes stay, only the link is removed.')){P=P.filter(p=>p.id!==id);sel.delete(id);if(pf===id)pf='';saveP();renderPeople();render()}}
function renderPeople(){$('cl').innerHTML=cats().map(c=>`<option value="${esc(c)}">`).join('');
 $('plist').innerHTML=P.length?cats().filter(c=>P.some(p=>p.cat===c)).map(c=>`<div class="ch">${esc(c)}</div>`+P.filter(p=>p.cat===c).sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<div class="pr"><span>${esc(p.name)} <small class="mut">${E.filter(e=>(e.ppl||[]).includes(p.id)).length} notes</small></span><button onclick="setPf('${p.id}')">View</button><button onclick="delP('${p.id}')">✕</button></div>`).join('')).join(''):'<div class="empty">No people yet.<br>Create one above, e.g. Naveen in Friends.</div>'}
try{E=JSON.parse(localStorage.getItem('diary26')||'[]')}catch(e){}
const $=i=>document.getElementById(i),M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],D=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fd(s){const[y,m,d]=s.split('-').map(Number),x=new Date(y,m-1,d);return String(d).padStart(2,'0')+'-'+M[m-1]+'-'+y+' '+D[x.getDay()]}
function persist(){try{localStorage.setItem('diary26',JSON.stringify(E))}catch(e){}}
function dress(e){const p=[];
 if(e.sc||e.sp||e.sb)p.push([e.sc,e.sp,'shirt'].filter(Boolean).join(' ')+(e.sb?' ('+e.sb+')':''));
 if(e.pc||e.pp||e.pb)p.push([e.pc,e.pp,e.pb||'pant'].filter(Boolean).join(' '));
 if(e.acc)p.push('accessories: '+e.acc);return p}
function others(e){return pnames(e).filter(n=>n.toLowerCase()!==(e.name||'').toLowerCase())}
function hd(e){return e.title||e.name||pnames(e).join(', ')}
function sub(e){const a=[];if(e.title&&e.name)a.push(e.name+(e.nick?' ('+e.nick+')':''));else if(e.nick)a.push('('+e.nick+')');const o=others(e);if(o.length&&(e.title||e.name))a.push('with '+o.join(', '));return a.join(' · ')}
let DR={};
function legacy(e){return(e.sc||e.sp||e.sb||e.pc||e.pp||e.pb||e.acc)?{main:{sc:e.sc,sp:e.sp,sb:e.sb,pc:e.pc,pp:e.pb,acc:e.acc}}:{}}
function sd(k,x,v){(DR[k]=DR[k]||{})[x]=v}
function curDress(){const r={};Object.keys(DR).forEach(k=>{if(k!=='main'&&!sel.has(k))return;if(Object.values(DR[k]).some(v=>v))r[k]=DR[k]});return r}
function dblock(k,title){const d=DR[k]||{};
 const dd=(x,o)=>`<select onchange="sd('${k}','${x}',this.value)">`+o.map(z=>`<option ${d[x]===z?'selected':''}>${z}</option>`).join('')+'</select>';
 const pat=x=>`<select onchange="sd('${k}','${x}',this.value)"><option value="">-</option>`+['plain','check','print'].map(z=>`<option ${d[x]===z?'selected':''}>${z}</option>`).join('')+'</select>';
 const inp=(x,ph,l)=>`<input value="${esc(d[x]||'')}" placeholder="${ph||''}" ${l?'list="'+l+'"':''} oninput="sd('${k}','${x}',this.value)">`;
 return`<div class="add"><div class="ch" style="margin-top:0">${esc(title)}</div>${dd('st',['Shirt','T-shirt'])}
 <div class="g3"><div><label>Color</label>${inp('sc')}</div><div><label>Pattern</label>${pat('sp')}</div><div><label>Brand</label>${inp('sb')}</div></div>
 <div style="height:12px"></div>${dd('pt',['Pant','Shorts'])}
 <div class="g3"><div><label>Color</label>${inp('pc')}</div><div><label>Type</label>${inp('pp','jeans…','ptl')}</div><div><label>Brand</label>${inp('pb')}</div></div>
 <label>Accessories</label>${inp('acc','watch, cap, chain')}</div>`}
function renderDress(){const mn=$('name').value.trim();const ids=[...sel].filter(i=>{const p=P.find(x=>x.id===i);return p&&p.name.toLowerCase()!==mn.toLowerCase()});
 $('dr').innerHTML=dblock('main',mn||'Main person')+ids.map(i=>dblock(i,P.find(p=>p.id===i).name)).join('')}
function dressHtml(e){const D2=e.dress||legacy(e),ks=Object.keys(D2);
 return ks.map(k=>{const d=D2[k],nm=k==='main'?e.name:(P.find(p=>p.id===k)||{}).name,L=[];
  if(d.sc||d.sp||d.sb)L.push('👕 '+[d.sc,d.sp,(d.st||'Shirt').toLowerCase()].filter(Boolean).join(' ')+(d.sb?' ('+d.sb+')':''));
  if(d.pc||d.pp||d.pb)L.push('👖 '+[d.pc,d.pp,(d.pt||'Pant').toLowerCase()].filter(Boolean).join(' ')+(d.pb?' ('+d.pb+')':''));
  if(d.acc)L.push('⌚ '+d.acc);
  if(!L.length)return'';
  return`<div class="pd">${ks.length>1&&nm?`<div class="pn">${esc(nm)}</div>`:''}${L.map(x=>`<div class="dr">${esc(x)}</div>`).join('')}</div>`}).join('')}
function tagsOf(e){return e.tag.split(',').map(t=>t.trim()).filter(Boolean)}
function allTags(){return[...new Set(E.flatMap(tagsOf))].sort()}
function render(){
 const q=$('q').value.toLowerCase().trim();
 const tb=$('tagbar');tb.innerHTML=allTags().length?['All',...allTags()].map(t=>`<button class="chip ${(t==='All'&&!ft)||t===ft?'on':''}" data-t="${esc(t)}">${t==='All'?'📁 All':'🏷 '+esc(t)}</button>`).join(''):'';
 tb.querySelectorAll('button').forEach(b=>b.onclick=()=>{ft=b.dataset.t==='All'?'':b.dataset.t;render()});
 const r=E.filter(e=>{
  if(ft&&!tagsOf(e).includes(ft))return false;
  if(pf&&!(e.ppl||[]).includes(pf))return false;
  if(!q)return true;
  return [e.date,fd(e.date),e.title,e.name,e.nick,e.tag,pnames(e).join(' ')].join(' ').toLowerCase().includes(q)}).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
 $('list').innerHTML=r.length?r.map(e=>{const d=dress(e);return`<div class="entry"><div class="d">${fd(e.date)}</div>
 ${hd(e)?`<div class="n">${esc(hd(e))}</div>`:''}${sub(e)?`<div class="sm">${esc(sub(e))}</div>`:''}
 ${dressHtml(e)}
 
 <div class="w">${esc(e.what)}</div>${tagsOf(e).map(t=>`<span class="t">#${esc(t)}</span>`).join('')}
 <div class="act"><button onclick="openForm(${e.id})">Edit</button><button onclick="del(${e.id})">Delete</button></div></div>`}).join(''):
 `<div class="empty">${E.length?'No notes found 🔍':'No notes yet.<br>Tap + to write your first diary note ✨'}</div>`;
 const pp=P.find(p=>p.id===pf);$('pfbar').innerHTML=pp?`<button class="chip on" onclick="setPf('')">👤 ${esc(pp.name)} ✕</button>`:'';
 $('names').innerHTML=[...new Set([...E.map(e=>e.name),...P.map(p=>p.name)].filter(Boolean))].map(n=>`<option value="${esc(n)}">`).join('');
 $('tagl').innerHTML=allTags().map(n=>`<option value="${esc(n)}">`).join('');
}
const F=['date','title','name','nick','tag','what'];
function openForm(id){editId=id||null;$('err').textContent='';
 const e=id?E.find(x=>x.id===id):{date:new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10)};
 F.forEach(k=>$(k).value=e[k]||'');DR=e.dress?JSON.parse(JSON.stringify(e.dress)):legacy(e);sel=new Set(e.ppl||[]);$('ps').value='';renderPick();$('ft').textContent=id?'Edit Note':'New Diary Note';$('m').classList.add('show')}
function closeForm(){$('m').classList.remove('show')}
function save(){const o={};F.forEach(k=>o[k]=$(k).value.trim());o.ppl=[...sel];o.dress=curDress();
 if(!o.date||!o.tag||!o.what){$('err').textContent='Date, Tag and What happened are required.';return}
 if(editId)Object.assign(E.find(x=>x.id===editId),o);else{o.id=Date.now();E.push(o)}
 persist();closeForm();render()}
function del(id){if(confirm('Delete this note?')){E=E.filter(x=>x.id!==id);persist();render()}}
$('m').onclick=e=>{if(e.target.id==='m')closeForm()};
render();
</script></body></html>
